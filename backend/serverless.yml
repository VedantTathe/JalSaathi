service: jalsaathi-backend
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  environment:
    DEPLOYMENT_TARGET: aws
    NODE_ENV: production
    BACKEND_URL: ${env:BACKEND_URL}
    MONGODB_URI: ${env:MONGODB_URI}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN}
    EMAIL_HOST: ${env:EMAIL_HOST}
    EMAIL_PORT: ${env:EMAIL_PORT}
    EMAIL_SECURE: ${env:EMAIL_SECURE}
    EMAIL_USER: ${env:EMAIL_USER}
    EMAIL_PASS: ${env:EMAIL_PASS}
    EMAIL_FROM: ${env:EMAIL_FROM}
    PLATFORM_COMMISSION_PERCENT: ${env:PLATFORM_COMMISSION_PERCENT}
    IS_WEBSITE_ON: ${env:IS_WEBSITE_ON}
    RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID}
    RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET}
    RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET}

functions:
  api:
    handler: server.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

# Notes:
# - This uses the handler defined in `backend/server.js` (server.handler).
# - All HTTP routes are proxied to the Lambda via API Gateway HTTP API.
