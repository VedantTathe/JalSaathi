<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#3b82f6"/>
  
  <!-- Water droplet -->
  <path d="M256 100 
           C 200 160, 160 200, 160 270
           C 160 323, 203 366, 256 366
           C 309 366, 352 323, 352 270
           C 352 200, 312 160, 256 100 Z" 
        fill="url(#waterGradient)" 
        stroke="#ffffff" 
        stroke-width="8"/>
  
  <!-- Highlight -->
  <ellipse cx="230" cy="200" rx="25" ry="35" fill="#ffffff" opacity="0.4"/>
  
  <!-- Text - JalSaathi -->
  <text x="256" y="440" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle">
    JalSaathi
  </text>
</svg>
